<div class="form-backdrop" role="presentation" (click)="cancelled.emit()">
  <section
    class="student-form-panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="form-title"
    (click)="$event.stopPropagation()"
  >
    <header class="form-header">
      <div>
        <p class="eyebrow">STUDENT DIRECTORY</p>
        <h2 id="form-title">Add a student</h2>
        <p>Enter the student and guardian information below.</p>
      </div>
      <button class="close-button" type="button" aria-label="Close form" (click)="cancelled.emit()">
        ×
      </button>
    </header>

    <form [formGroup]="studentForm" (ngSubmit)="submit()">
      <div class="form-section">
        <h3>Student information</h3>
        <div class="form-grid">
          <label
            >First name<input formControlName="firstName" autocomplete="given-name" />
            @if (
              studentForm.controls.firstName.touched &&
              studentForm.controls.firstName.hasError('required')
            ) {
              <span class="field-error">First name is required.</span>
            }
          </label>
          <label
            >Last name<input formControlName="lastName" autocomplete="family-name" />
            @if (
              studentForm.controls.lastName.touched &&
              studentForm.controls.lastName.hasError('required')
            ) {
              <span class="field-error">Last name is required.</span>
            }
          </label>
          <label
            >Email<input type="email" formControlName="email" autocomplete="email" />
            @if (
              studentForm.controls.email.touched && studentForm.controls.email.hasError('required')
            ) {
              <span class="field-error">Email is required.</span>
            } @else if (
              studentForm.controls.email.touched && studentForm.controls.email.hasError('email')
            ) {
              <span class="field-error">Enter a valid email address.</span>
            }
          </label>
          <label
            >Phone<input type="tel" formControlName="phone" autocomplete="tel" />
            @if (
              studentForm.controls.phone.touched && studentForm.controls.phone.hasError('required')
            ) {
              <span class="field-error">Phone number is required.</span>
            }
          </label>
          <label
            >Date of birth<input type="date" formControlName="dateOfBirth" />
            @if (
              studentForm.controls.dateOfBirth.touched &&
              studentForm.controls.dateOfBirth.hasError('required')
            ) {
              <span class="field-error">Date of birth is required.</span>
            }
          </label>
          <label
            >Gender<select formControlName="gender">
              <option value="Female">Female</option>
              <option value="Male">Male</option>
              <option value="Non-binary">Non-binary</option>
            </select></label
          >
          <label
            >Grade<input formControlName="grade" />
            @if (
              studentForm.controls.grade.touched && studentForm.controls.grade.hasError('required')
            ) {
              <span class="field-error">Grade is required.</span>
            }
          </label>
          <label
            >Class<input formControlName="className" />
            @if (
              studentForm.controls.className.touched &&
              studentForm.controls.className.hasError('required')
            ) {
              <span class="field-error">Class is required.</span>
            }
          </label>
          <label
            >Enrollment date<input type="date" formControlName="enrollmentDate" />
            @if (
              studentForm.controls.enrollmentDate.touched &&
              studentForm.controls.enrollmentDate.hasError('required')
            ) {
              <span class="field-error">Enrollment date is required.</span>
            }
          </label>
          <label
            >Status<select formControlName="status">
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select></label
          >
          <label class="full-width"
            >Address<input formControlName="address" autocomplete="street-address" />
            @if (
              studentForm.controls.address.touched &&
              studentForm.controls.address.hasError('required')
            ) {
              <span class="field-error">Address is required.</span>
            }
          </label>
        </div>
      </div>

      <div class="form-section guardian-section">
        <h3>Guardian information</h3>
        <div class="form-grid">
          <label
            >Guardian name<input formControlName="guardianName" />
            @if (
              studentForm.controls.guardianName.touched &&
              studentForm.controls.guardianName.hasError('required')
            ) {
              <span class="field-error">Guardian name is required.</span>
            }
          </label>
          <label
            >Guardian phone<input type="tel" formControlName="guardianPhone" />
            @if (
              studentForm.controls.guardianPhone.touched &&
              studentForm.controls.guardianPhone.hasError('required')
            ) {
              <span class="field-error">Guardian phone is required.</span>
            }
          </label>
        </div>
      </div>

      <footer class="form-actions">
        <button class="cancel-button" type="button" (click)="cancelled.emit()">Cancel</button>
        <button class="submit-button" type="submit">Add student</button>
      </footer>
    </form>
  </section>
</div>
